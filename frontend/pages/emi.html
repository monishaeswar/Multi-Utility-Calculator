<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Calculator | Multi-Utility Calculator</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/calculator.css">
</head>
<body>
    <div class="navbar">
        <a class="brand" href="../index.html">🧮 Multi-Utility Calculator</a>
        <nav>
            <a href="../index.html">Home</a>
            <a href="history.html">History</a>
        </nav>
    </div>

    <div class="container">
        <div class="card">
            <div class="calc-header">
                <span class="icon">🏦</span>
                <h1>EMI Calculator</h1>
            </div>
            <p class="calc-subtitle">Calculate your monthly loan installment.</p>

            <form id="emi-form">
                <div class="form-group">
                    <label for="principal">Loan Amount (Principal)</label>
                    <input type="number" step="any" id="principal" required>
                </div>
                <div class="two-col">
                    <div class="form-group">
                        <label for="rate">Annual Interest Rate (%)</label>
                        <input type="number" step="any" id="rate" required>
                    </div>
                    <div class="form-group">
                        <label for="tenure">Tenure (months)</label>
                        <input type="number" step="1" id="tenure" required>
                    </div>
                </div>

                <div class="btn-row">
                    <button type="submit">Calculate</button>
                </div>
            </form>

            <div id="result-box" class="result-box"></div>
            <div id="error-box" class="error-box"></div>
        </div>
    </div>

    <footer>Multi-Utility Calculator &copy; 2026</footer>

    <script src="../js/api.js"></script>
    <script src="../js/emi.js"></script>
</body>
</html>

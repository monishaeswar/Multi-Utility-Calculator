<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount Calculator | Multi-Utility Calculator</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/calculator.css">
</head>
<body>
    <div class="navbar">
        <a class="brand" href="../index.html">🧮 Multi-Utility Calculator</a>
        <nav>
            <a href="../index.html">Home</a>
            <a href="history.html">History</a>
        </nav>
    </div>

    <div class="container">
        <div class="card">
            <div class="calc-header">
                <span class="icon">🏷️</span>
                <h1>Discount Calculator</h1>
            </div>
            <p class="calc-subtitle">Find the final price and savings after a discount.</p>

            <form id="discount-form">
                <div class="two-col">
                    <div class="form-group">
                        <label for="price">Original Price</label>
                        <input type="number" step="any" id="price" required>
                    </div>
                    <div class="form-group">
                        <label for="discountPercent">Discount (%)</label>
                        <input type="number" step="any" id="discountPercent" required>
                    </div>
                </div>

                <div class="btn-row">
                    <button type="submit">Calculate</button>
                </div>
            </form>

            <div id="result-box" class="result-box"></div>
            <div id="error-box" class="error-box"></div>
        </div>
    </div>

    <footer>Multi-Utility Calculator &copy; 2026</footer>

    <script src="../js/api.js"></script>
    <script src="../js/discount.js"></script>
</body>
</html>

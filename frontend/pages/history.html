<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History | Multi-Utility Calculator</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/calculator.css">
</head>
<body>
    <div class="navbar">
        <a class="brand" href="../index.html">🧮 Multi-Utility Calculator</a>
        <nav>
            <a href="../index.html">Home</a>
            <a href="history.html" class="active">History</a>
        </nav>
    </div>

    <div class="container">
        <div class="card">
            <div class="calc-header">
                <span class="icon">🕘</span>
                <h1>Calculation History</h1>
            </div>
            <p class="calc-subtitle">Review, filter, and manage your past calculations.</p>

            <div class="filter-bar">
                <select id="filter-type">
                    <option value="">All Types</option>
                    <option value="BASIC">Basic</option>
                    <option value="BMI">BMI</option>
                    <option value="AGE">Age</option>
                    <option value="EMI">EMI</option>
                    <option value="GST">GST</option>
                    <option value="PERCENTAGE">Percentage</option>
                    <option value="DISCOUNT">Discount</option>
                </select>
                <button id="clear-all-btn" class="secondary">Clear All History</button>
            </div>

            <table class="history-table">
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>Input</th>
                        <th>Result</th>
                        <th>Date</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="history-body"></tbody>
            </table>

            <div id="empty-state" class="empty-state" style="display:none;">
                No calculations yet. Try one of the calculators!
            </div>

            <div id="error-box" class="error-box"></div>
        </div>
    </div>

    <footer>Multi-Utility Calculator &copy; 2026</footer>

    <script src="../js/api.js"></script>
    <script src="../js/history.js"></script>
</body>
</html>

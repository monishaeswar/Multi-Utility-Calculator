<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator | Multi-Utility Calculator</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/calculator.css">
</head>
<body>
    <div class="navbar">
        <a class="brand" href="../index.html">🧮 Multi-Utility Calculator</a>
        <nav>
            <a href="../index.html">Home</a>
            <a href="history.html">History</a>
        </nav>
    </div>

    <div class="container">
        <div class="card">
            <div class="calc-header">
                <span class="icon">➕</span>
                <h1>Basic Calculator</h1>
            </div>
            <p class="calc-subtitle">Perform simple arithmetic operations.</p>

            <form id="basic-form">
                <div class="two-col">
                    <div class="form-group">
                        <label for="a">First number (a)</label>
                        <input type="number" step="any" id="a" required>
                    </div>
                    <div class="form-group">
                        <label for="b">Second number (b)</label>
                        <input type="number" step="any" id="b" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="operation">Operation</label>
                    <select id="operation" required>
                        <option value="ADD">Add (+)</option>
                        <option value="SUBTRACT">Subtract (−)</option>
                        <option value="MULTIPLY">Multiply (×)</option>
                        <option value="DIVIDE">Divide (÷)</option>
                        <option value="MODULUS">Modulus (%)</option>
                        <option value="POWER">Power (^)</option>
                    </select>
                </div>

                <div class="btn-row">
                    <button type="submit">Calculate</button>
                </div>
            </form>

            <div id="result-box" class="result-box"></div>
            <div id="error-box" class="error-box"></div>
        </div>
    </div>

    <footer>Multi-Utility Calculator &copy; 2026</footer>

    <script src="../js/api.js"></script>
    <script src="../js/basic.js"></script>
</body>
</html>

# Server
server.port=${PORT:8080}

# Database Connection (PostgreSQL / Neon)
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-plain-heart-az06u0a9-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USER:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_sWw4lRHCYo8i}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Jackson
spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.com.calculator=INFO

# Fixes Neon DB Sleep Issue
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-test-query=SELECT 1
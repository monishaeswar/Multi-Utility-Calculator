# Server
server.port=${PORT:8080}

# --- MySQL (production/default) ---
spring.datasource.url=jdbc:mysql://localhost:3306/calculator_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Monisha@219
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Jackson ---
spring.jackson.default-property-inclusion=non_null

# --- Logging ---
logging.level.com.calculator=INFO
